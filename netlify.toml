[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# CDN cache policy for static media. Netlify ignores next.config.mjs header
# rules for files served straight from public/, so every tour image and clip
# was shipping with max-age=0 and re-validating on every view. A month of
# cache (with a day of stale-while-revalidate so updates roll through
# gracefully) covers everything that is safe to cache hard.
#
# HTML and API responses are deliberately absent: prices and availability
# must stay live, and the Next runtime already serves those no-store.

[[headers]]
  for = "/tours/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/mapl-logo.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/mapl-logo-dark.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# Hero media is not content-hashed, so a day, not a month: a replaced poster
# reaches returning visitors by tomorrow instead of revalidating on every visit.
[[headers]]
  for = "/hero-negril-jamaica-portrait.webp"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/hero-negril-jamaica-portrait.mp4"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/hero-negril-jamaica-540.mp4"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/hero-negril-jamaica-720.mp4"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/hero-negril-jamaica-1080.mp4"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/hero-negril-jamaica.mp4"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/mapl-logo-email.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
